name: Windows CPU component validation
# PR 會以 GitHub 產生的暫時 merge commit 執行，報告中的 commit 即該暫時提交；
# 要以分支上的固定提交留存證據時，改用 workflow_dispatch 指定分支。兩者都不發布產物。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-cpu-validation.yml'
      - 'scripts/**'
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-cpu-validation.yml'
      - 'scripts/**'
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-cpu-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  cpu-component:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fd69854ee19ba031362750072e22a92bf5463a7c
          path: out/previous-cpu-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent CPU bundle and validate with a lean controller
        shell: pwsh
        run: |
          python scripts/run_windows_cpu_ci.py --output out/windows-cpu --previous-source out/previous-cpu-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cpu-validation-reports
          path: out/windows-cpu/reports/
          retention-days: 7
          if-no-files-found: warn
