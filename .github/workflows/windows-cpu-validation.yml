name: Windows CPU component validation
# PR 會以 GitHub 產生的暫時 merge commit 執行，報告中的 commit 即該暫時提交；
# 要以分支上的固定提交留存證據時，改用 workflow_dispatch 指定分支。兩者都不發布產物。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-cpu-validation.yml'
      - 'scripts/**'
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-cpu-validation.yml'
      - 'scripts/**'
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      candidate_source:
        description: 'A6 固定候選的完整來源 SHA；空白為一般驗證'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-cpu-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  MARKITDOWN_CANDIDATE_SOURCE: ${{ inputs.candidate_source || '' }}
jobs:
  cpu-component:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fd69854ee19ba031362750072e22a92bf5463a7c
          path: out/previous-cpu-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify selected immutable source
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          python scripts/candidate_review.py --check-source --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build independent CPU bundle and validate with a lean controller
        shell: pwsh
        run: |
          python scripts/run_windows_cpu_ci.py --output out/windows-cpu --previous-source out/previous-cpu-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Classify and preserve candidate review metadata
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows-cpu/build-env/Scripts/python.exe" scripts/candidate_review.py --profile cpu --bundle "out/windows-cpu/dist/MarkItDownOCRWorker" --reports "out/windows-cpu/reports" --package-directory "out/windows-cpu/package" --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # metadata 每步最多八個 notice，避免平台的每步註記上限造成證據截斷。
      - name: Preserve review metadata page 1
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows-cpu/build-env/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows-cpu/reports/source-review.json" --page 0 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 2
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows-cpu/build-env/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows-cpu/reports/source-review.json" --page 1 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 3
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows-cpu/build-env/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows-cpu/reports/source-review.json" --page 2 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 4
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows-cpu/build-env/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows-cpu/reports/source-review.json" --page 3 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 5
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -match '^[0-9a-f]{40}$') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows-cpu/build-env/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows-cpu/reports/source-review.json" --page 4 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cpu-validation-reports
          path: out/windows-cpu/reports/
          retention-days: 7
          if-no-files-found: warn
