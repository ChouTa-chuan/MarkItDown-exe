name: Windows base validation

# PR 會以 GitHub 產生的暫時 merge commit 執行，報告中的 commit 即該暫時提交；
# 一般驗證不發布產品。B1b 測試版另外以手動執行選擇，並在上傳前核對 main 與產物證據。
on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/windows-base-validation.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/windows-base-validation.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      candidate_source:
        description: 'A6 固定候選的完整來源 SHA；空白為一般驗證'
        required: false
        type: string
      prepare_test_build:
        description: '組裝並對照固定 b17d51b 測試版'
        required: false
        type: boolean
        default: false
      publish_test_build:
        description: 'B1b 公開上傳（限 main 的首次執行）'
        required: false
        type: boolean
        default: false
      ocr_inputs_run:
        description: '既有 Windows validation 的 OCR 輸入 run；空白選最新未到期者'
        required: false
        type: string
      saved_baseline_run:
        description: '已備份原始 provenance 的試跑 run；空白使用固定 run 44295039865'
        required: false
        type: string
      retained_review:
        description: '原始清單到期且未保存時，明確選擇使用較弱的 repo 證據'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-base-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  MARKITDOWN_CANDIDATE_SOURCE: ${{ inputs.candidate_source || '' }}

jobs:
  native-inputs:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.prepare_test_build }}
    name: Fixed Windows OCR inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        # tee 保留早期失敗日誌，pipefail 保留原命令的非零結果。
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Linux build dependencies
        run: |
          mkdir -p out/ci-logs
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --require-hashes -r packaging/profiles/base-linux-build.txt 2>&1 | tee -a out/ci-logs/dependencies.log
          .venv-ci/bin/python -m pip install --no-deps --no-build-isolation ./vendor/markitdown . 2>&1 | tee -a out/ci-logs/dependencies.log
          python -m venv .venv-native-tools
          .venv-native-tools/bin/python -m pip install --require-hashes -r packaging/native/ci-tools-linux.txt 2>&1 | tee -a out/ci-logs/dependencies.log
      - name: Fetch and verify fixed public inputs
        run: .venv-ci/bin/python scripts/fetch_windows_ci_inputs.py --output out/native-inputs 2>&1 | tee out/ci-logs/fetch.log
      - name: Cross-build fixed Windows native candidate
        run: |
          .venv-ci/bin/python scripts/build_minimal_native.py --inputs out/native-inputs --work out/native-build --cmake "$PWD/.venv-native-tools/bin/cmake" --ninja "$PWD/.venv-native-tools/bin/ninja" --jobs 2 --report out/build-evidence.json
      - name: Prepare transfer for the Windows job
        run: |
          mkdir -p out/transfer
          cp -R out/native-build/candidate out/transfer/candidate
          cp -R out/native-inputs/models out/transfer/models
          cp out/build-evidence.json out/transfer/build-evidence.json
      # 僅同一次 CI 的測試輸入；不建立 Release 或安裝包，隔日到期。
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ocr-ci-inputs
          path: out/transfer/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-build-reports
          path: |
            out/build-evidence.json
            out/native-inputs/downloads.json
            out/native-build/*.log
            out/native-build/commands.json
            out/ci-logs/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish actual native preparation summary
        if: always()
        run: python scripts/publish_windows_ci_summary.py --reports out --summary "$GITHUB_STEP_SUMMARY"

  windows-base:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.prepare_test_build }}
    name: Windows 2022 base build and OCR
    needs: native-inputs
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout genuine previous base source
        uses: actions/checkout@v4
        with:
          ref: 990e600aed9e26011b77d46dfe5f9e5bb13ecc7a
          path: out/previous-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify selected immutable source
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          python scripts/candidate_review.py --check-source --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: windows-ocr-ci-inputs
          path: out/inputs
      - name: Build and validate the native Windows application
        shell: pwsh
        run: |
          python scripts/run_windows_base_ci.py --inputs "$PWD/out/inputs" --output "$PWD/out/windows" --installer --previous-source "$PWD/out/previous-source" --recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Classify and preserve candidate review metadata
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/candidate_review.py --profile base --bundle "out/windows/dist/MarkItDownBase" --reports "out/windows/reports" --package-directory "out/windows/installer-work/setup" --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # metadata 每步最多八個 notice，避免平台的每步註記上限造成證據截斷。
      - name: Preserve review metadata page 1
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows/reports/source-review.json" --page 0 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 2
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows/reports/source-review.json" --page 1 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 3
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows/reports/source-review.json" --page 2 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 4
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows/reports/source-review.json" --page 3 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve review metadata page 5
        shell: pwsh
        # 來源輸入只透過環境變數傳入，避免 expression 成為 PowerShell 程式碼。
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/candidate_review.py --publish "out/windows/reports/source-review.json" --page 4 --expected-source "$env:EXPECTED_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Microsoft runtime copies without modifying the bundle
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ inputs.candidate_source || github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & "out/windows/build-venv/Scripts/python.exe" scripts/microsoft_runtime.py --bundle "out/windows/dist/MarkItDownBase" --source-review "out/windows/reports/source-review.json" --expected-source "$env:EXPECTED_SOURCE" --output "out/windows/reports/microsoft-runtime.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish actual validation summary
        if: always()
        shell: pwsh
        run: |
          python scripts/publish_windows_ci_summary.py --reports "$PWD/out/windows/reports" --summary "$env:GITHUB_STEP_SUMMARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-base-validation-reports
          path: out/windows/reports/
          retention-days: 7
          if-no-files-found: warn

  b1-test-build:
    name: B1b fixed candidate test build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_test_build }}
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      # payload 與政策分開 checkout；不得把 workflow 的 SHA 改寫成 payload 的來源。
      MARKITDOWN_CANDIDATE_SOURCE: b17d51bc99f8402f16b99f98bbe3b3370530bc6c
    steps:
      - name: Checkout current approval and packaging controller
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # A13b 固定候選的 python312.dll PE 版本；避免 minor 選擇器日後漂移。
          python-version: '3.12.10'
      - name: Plan fixed source and validated OCR inputs
        id: plan
        working-directory: control
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.ocr_inputs_run }}
          PUBLISH_REQUESTED: ${{ inputs.publish_test_build }}
          BASELINE_RUN: ${{ inputs.saved_baseline_run }}
          RETAINED_REVIEW: ${{ inputs.retained_review }}
        run: |
          python scripts/base_test_build.py --plan --ocr-input-run "$env:INPUT_RUN" --publish "$env:PUBLISH_REQUESTED" --baseline-run "$env:BASELINE_RUN" --retained-review "$env:RETAINED_REVIEW" --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout immutable application source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.candidate_source }}
          path: candidate
          persist-credentials: false
      - name: Download existing validated native inputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.inputs_run }}
          name: ${{ steps.plan.outputs.inputs_name }}
          path: out/test-build-inputs
      - name: Download fixed baseline provenance reports
        if: ${{ steps.plan.outputs.retained_review == 'false' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.baseline_run }}
          name: ${{ steps.plan.outputs.baseline_artifact }}
          path: out/test-build-baseline
      - name: Verify native input bytes against the fixed candidate
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --verify-inputs --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --inputs "$env:GITHUB_WORKSPACE/out/test-build-inputs" --candidate "$env:GITHUB_WORKSPACE/candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate the actual fixed Windows installer
        id: fixed-build
        working-directory: candidate
        shell: pwsh
        run: |
          python scripts/run_windows_base_ci.py --inputs "$env:GITHUB_WORKSPACE/out/test-build-inputs" --output "$env:GITHUB_WORKSPACE/out/test-build-windows" --installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish actual test-build validation summary
        if: ${{ always() && steps.fixed-build.outcome != 'skipped' }}
        working-directory: control
        shell: pwsh
        run: |
          python scripts/publish_windows_ci_summary.py --reports "$env:GITHUB_WORKSPACE/out/test-build-windows/reports" --summary "$env:GITHUB_STEP_SUMMARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble product attachments and independently verify reports
        working-directory: control
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/out/test-build-windows/build-venv/Scripts/python.exe" scripts/base_test_build.py --collect --baseline "$env:GITHUB_WORKSPACE/out/test-build-baseline" --baseline-copy "$env:GITHUB_WORKSPACE/out/test-build-baseline-backup/bundle-provenance.json" --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --inputs "$env:GITHUB_WORKSPACE/out/test-build-inputs" --candidate "$env:GITHUB_WORKSPACE/candidate" --build "$env:GITHUB_WORKSPACE/out/test-build-windows" --product "$env:GITHUB_WORKSPACE/out/test-build-package" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test-build report metadata page 1
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --publish-page 0 --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test-build report metadata page 2
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --publish-page 1 --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test-build report metadata page 3
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --publish-page 2 --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test-build report metadata page 4
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --publish-page 3 --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 只有報告式試跑可備份有期限的原件。公開 run 僅有產品與報告兩個 artifact。
      - name: Preserve verified original provenance from the trial
        if: ${{ always() && steps.plan.outcome == 'success' && !inputs.publish_test_build && !inputs.retained_review }}
        uses: actions/upload-artifact@v4
        with:
          name: b1b-fixed-baseline-report
          path: out/test-build-baseline-backup/bundle-provenance.json
          retention-days: 30
          if-no-files-found: ignore
      # 產品目錄與報告目錄不可互用。

      - name: Upload test-build reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-test-build-reports
          # 明確列出文字報告；即使失敗或路徑配置錯誤，也不以寬泛目錄上傳 Setup。
          path: |
            out/test-build-reports/plan.json
            out/test-build-reports/BUILD-INFO.json
            out/test-build-reports/CONTENT-EQUIVALENCE.json
            out/test-build-reports/LICENSE-FILES.json
            out/test-build-reports/package-audit.json
            out/test-build-reports/SHA256SUMS.txt
            out/test-build-reports/README.md
            out/test-build-reports/known-gaps.json
            out/test-build-reports/known-gaps.md
            out/test-build-reports/test-build-limitations.md
          retention-days: 30
          if-no-files-found: warn
      # 本環境可能讀不到 artifact 儲存主機；由 hosted runner 下載實際 artifact 再逐檔驗。
      - name: Download uploaded reports for actual artifact verification
        uses: actions/download-artifact@v4
        with:
          name: base-test-build-reports
          path: out/test-build-roundtrip
      - name: Verify actual report artifact members and bytes
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --verify-report-artifact --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports" --downloaded "$env:GITHUB_WORKSPACE/out/test-build-roundtrip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Recheck publication gates and exact staged Setup
        id: authorize
        if: ${{ success() && github.ref == 'refs/heads/main' && inputs.publish_test_build && steps.plan.outputs.publish_allowed == 'true' }}
        working-directory: control
        shell: pwsh
        run: |
          python scripts/base_test_build.py --authorize-upload --plan-file "$env:GITHUB_WORKSPACE/out/test-build-reports/plan.json" --build "$env:GITHUB_WORKSPACE/out/test-build-windows" --product "$env:GITHUB_WORKSPACE/out/test-build-package" --reports "$env:GITHUB_WORKSPACE/out/test-build-reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer package only when B1b is enabled
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.authorize.outcome == 'success' && steps.plan.outputs.publish_allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDownBase-test-build
          path: out/test-build-package/
          retention-days: 30
          if-no-files-found: error
