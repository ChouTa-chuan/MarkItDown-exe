name: B1a Linux CI diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only the cancelled B1a Linux job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, re, subprocess, urllib.parse, zipfile
          # 只讀本 repo、固定已取消 job 的日誌；不建置、不發布產品，不輸出 token。
          endpoints=['repos/ChouTa-chuan/MarkItDown-exe/actions/runs/44448506413/attempts/1/logs',
                     'repos/ChouTa-chuan/MarkItDown-exe/actions/jobs/135306399551/logs']
          for endpoint in endpoints:
              result=subprocess.run(['gh','api',endpoint],capture_output=True,timeout=90)
              if result.returncode==0:
                  break
              message=result.stderr.decode('utf-8',errors='replace').replace(os.environ['GH_TOKEN'],'[redacted]')
              message=re.sub(r'https://[^\s]+',lambda m:'https://'+str(urllib.parse.urlsplit(m.group()).hostname)+'/[redacted]',message)
              print('::notice title=B1a diagnostic request::'+json.dumps({'endpoint':endpoint,'error':message[-500:],'stderr_sha256':hashlib.sha256(result.stderr).hexdigest()}).replace('%','%25'))
          else:
              raise SystemExit(1)
          raw=result.stdout
          if raw.startswith(b'PK'):
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  candidates=[i for i in z.infolist() if not i.is_dir() and i.file_size<8*1024*1024]
                  apt=[i for i in candidates if 'install native' in i.filename.lower()]
                  selected=apt or candidates
                  text='\n'.join(z.read(i).decode('utf-8',errors='replace') for i in selected)
          else:
              text=raw.decode('utf-8',errors='replace')
          lines=text.splitlines()
          relevant=[line for line in lines if any(word in line.lower() for word in ('apt-get','hit:','get:','err:','ign:','lock','waiting','unable','failed','sudo','cancel','unpacking','setting up','fetched'))]
          if relevant:
              text='\n'.join(relevant)
          payload={'check':'b1a-linux-apt-diagnostic','run':44448506413,'attempt':1,'job':135306399551,'log_sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'tail':text[-2500:]}
          body=json.dumps(payload,separators=(',',':'))
          while len(body.encode())>3600:
              payload['tail']=payload['tail'][200:]
              body=json.dumps(payload,separators=(',',':'))
          print('::notice title=B1a cancelled Linux apt log::'+body.replace('%','%25'))
          PY
  apt-mirror-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Test official signed Ubuntu mirror without changing application inputs
        id: apt
        shell: bash
        run: |
          mkdir -p out
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee out/apt.log
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends tesseract-ocr libegl1 fonts-noto-cjk fonts-dejavu-core 2>&1 | tee -a out/apt.log
          dpkg-query -W tesseract-ocr libegl1 fonts-noto-cjk fonts-dejavu-core | tee out/versions.txt
      - name: Preserve bounded actual mirror result
        if: always()
        shell: bash
        env:
          APT_OUTCOME: ${{ steps.apt.outcome }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          path=Path('out/apt.log')
          raw=path.read_bytes() if path.is_file() else b''
          versions=Path('out/versions.txt')
          record={'check':'b1a-apt-mirror-smoke','accepted':os.environ['APT_OUTCOME']=='success','apt_log_sha256':hashlib.sha256(raw).hexdigest(),'versions':versions.read_text() if versions.is_file() else None,'tail':raw.decode('utf-8',errors='replace')[-2200:]}
          print('::notice title=B1a official mirror smoke::'+json.dumps(record,separators=(',',':')).replace('%','%25'))
          PY
