name: Microsoft runtime evidence

# 只讀鎖定來源、PE 身分與本機既有條款；不建置或上傳 Setup／worker／模型。
# 完整基本包仍由 Windows base validation 驗證，這個快速流程不取代它。
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/microsoft-runtime-evidence.yml'
      - 'scripts/microsoft_runtime.py'
      - 'scripts/embedded_runtime.py'
      - 'scripts/cpu_native_observation.py'
      - 'tests/test_embedded_runtime.py'
      - 'packaging/embedded/**'
      - 'tests/test_microsoft_runtime.py'
      - 'packaging/microsoft/**'
      - 'packaging/redistribution/obligations.json'
  workflow_dispatch:
    inputs:
      b3d_frozen_evidence:
        description: 'Read a Windows rebuild of the fixed B3d worker'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: microsoft-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  evidence:
    if: ${{ !inputs.b3d_frozen_evidence }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original hash-locked build environment
        shell: pwsh
        run: |
          python -m venv out/microsoft-env
          & out/microsoft-env/Scripts/python.exe -m pip install --require-hashes -r packaging/profiles/base-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/microsoft-env/Scripts/python.exe -m pip install --no-deps --no-build-isolation ./vendor/markitdown .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe installed sources and compare each to A6 bytes
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          New-Item -ItemType Directory -Force out/microsoft-reports | Out-Null
          & out/microsoft-env/Scripts/python.exe scripts/microsoft_runtime.py --installed-sources --expected-source "$env:EXPECTED_SOURCE" --output out/microsoft-reports/microsoft-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe embedded component version APIs against the fixed candidate
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & out/microsoft-env/Scripts/python.exe scripts/embedded_runtime.py --expected-source "$env:EXPECTED_SOURCE" --output out/microsoft-reports/embedded-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microsoft-runtime-evidence-reports
          path: out/microsoft-reports/
          retention-days: 7
          if-no-files-found: warn

  cpu-evidence:
    if: ${{ !inputs.b3d_frozen_evidence }}
    name: CPU locked wheel observation
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install CPU hash-locked build environment
        shell: pwsh
        run: |
          python -m venv out/cpu-evidence-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/cpu-evidence-env/Scripts/python.exe -m pip install --require-hashes -r packaging/profiles/cpu-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe CPU module versions and two renamed Microsoft DLLs
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force out/cpu-evidence-reports | Out-Null
          & out/cpu-evidence-env/Scripts/python.exe scripts/cpu_native_observation.py --expected-source "$env:EXPECTED_SOURCE" --output out/cpu-evidence-reports/cpu-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-native-observation-reports
          path: out/cpu-evidence-reports/
          retention-days: 7
          if-no-files-found: warn


  b3d-frozen:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.b3d_frozen_evidence }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b17d51bc99f8402f16b99f98bbe3b3370530bc6c
          path: out/b3d-fixed-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Build the fixed worker for disposable Windows inspection
        shell: pwsh
        run: |
          python -m venv out/b3d-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Resolve-Path out/b3d-venv/Scripts/python.exe).Path
          & $python -m pip install --require-hashes -r out/b3d-fixed-source/packaging/profiles/cpu-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps --no-build-isolation ./out/b3d-fixed-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python out/b3d-fixed-source/scripts/prepare_worker_assets.py --output out/b3d-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MARKITDOWN_WORKER_ASSETS = (Resolve-Path out/b3d-assets).Path
          & $python -m PyInstaller --noconfirm --clean --distpath out/b3d-dist --workpath out/b3d-work out/b3d-fixed-source/packaging/ocr-worker.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect and run the unchanged frozen worker
        shell: pwsh
        run: |
          & out/b3d-venv/Scripts/python.exe scripts/cpu_build_tools_runtime.py --bundle out/b3d-dist/MarkItDownOCRWorker --source out/b3d-fixed-source --original docs/development-records/runs/b3d-cpu-build-tools-2026-11-21/original-cpu-build-tools.json --output out/b3d-frozen-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
