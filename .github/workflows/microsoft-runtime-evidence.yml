name: Microsoft runtime evidence

# 只讀鎖定來源、PE 身分與本機既有條款；不建置或上傳 Setup／worker／模型。
# 完整基本包仍由 Windows base validation 驗證，這個快速流程不取代它。
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/microsoft-runtime-evidence.yml'
      - 'scripts/microsoft_runtime.py'
      - 'scripts/embedded_runtime.py'
      - 'scripts/cpu_native_observation.py'
      - 'tests/test_embedded_runtime.py'
      - 'packaging/embedded/**'
      - 'tests/test_microsoft_runtime.py'
      - 'packaging/microsoft/**'
      - 'packaging/redistribution/obligations.json'
  workflow_dispatch:
    inputs:
      geos_replacement_feasibility:
        description: 'Observe explicit GEOS replacement on Windows'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: microsoft-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  evidence:
    if: ${{ !inputs.geos_replacement_feasibility }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install original hash-locked build environment
        shell: pwsh
        run: |
          python -m venv out/microsoft-env
          & out/microsoft-env/Scripts/python.exe -m pip install --require-hashes -r packaging/profiles/base-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/microsoft-env/Scripts/python.exe -m pip install --no-deps --no-build-isolation ./vendor/markitdown .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe installed sources and compare each to A6 bytes
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          New-Item -ItemType Directory -Force out/microsoft-reports | Out-Null
          & out/microsoft-env/Scripts/python.exe scripts/microsoft_runtime.py --installed-sources --expected-source "$env:EXPECTED_SOURCE" --output out/microsoft-reports/microsoft-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe embedded component version APIs against the fixed candidate
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          if (-not ($env:EXPECTED_SOURCE -cmatch '^[0-9a-f]{40}\z') -or $env:EXPECTED_SOURCE.Length -ne 40) {
            throw "EXPECTED_SOURCE must be a full 40-character hexadecimal commit"
          }
          & out/microsoft-env/Scripts/python.exe scripts/embedded_runtime.py --expected-source "$env:EXPECTED_SOURCE" --output out/microsoft-reports/embedded-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microsoft-runtime-evidence-reports
          path: out/microsoft-reports/
          retention-days: 7
          if-no-files-found: warn

  cpu-evidence:
    if: ${{ !inputs.geos_replacement_feasibility }}
    name: CPU locked wheel observation
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install CPU hash-locked build environment
        shell: pwsh
        run: |
          python -m venv out/cpu-evidence-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/cpu-evidence-env/Scripts/python.exe -m pip install --require-hashes -r packaging/profiles/cpu-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe CPU module versions and two renamed Microsoft DLLs
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force out/cpu-evidence-reports | Out-Null
          & out/cpu-evidence-env/Scripts/python.exe scripts/cpu_native_observation.py --expected-source "$env:EXPECTED_SOURCE" --output out/cpu-evidence-reports/cpu-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-native-observation-reports
          path: out/cpu-evidence-reports/
          retention-days: 7
          if-no-files-found: warn

  geos-feasibility:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.geos_replacement_feasibility }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libgeos/geos
          ref: c389f532d25fe6228861d9b19339f9cb57ca4bdb
          path: out/geos-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install the locked Windows Shapely environment
        shell: pwsh
        run: |
          python -m venv out/geos-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/geos-venv/Scripts/python.exe -m pip install --require-hashes -r packaging/profiles/cpu-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe unchanged wheel binding
        shell: pwsh
        run: |
          & out/geos-venv/Scripts/python.exe scripts/geos_windows_feasibility.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build a separate GEOS 3.14.1 pair with the locked wheel basenames
        shell: pwsh
        run: |
          @'
          set_target_properties(geos PROPERTIES OUTPUT_NAME "geos-bf067cd6ff74ee0ad5f3ff52c7ef08c9")
          set_target_properties(geos_c PROPERTIES OUTPUT_NAME "geos_c-6dd9fd915eef8a7928285416bef1e666")
          '@ | Add-Content -LiteralPath out/geos-source/CMakeLists.txt
          cmake -S out/geos-source -B out/geos-build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_DOCUMENTATION=OFF -DBUILD_GEOSOP=OFF "-DCMAKE_CXX_FLAGS=/MP4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/geos-build --config Release --target geos_c --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory out/geos-replacement | Out-Null
          $dlls = @(Get-ChildItem -LiteralPath out/geos-build -Recurse -File -Filter "geos*.dll")
          if ($dlls.Count -ne 2) { throw "Expected exactly two GEOS DLLs" }
          $dlls | Copy-Item -Destination out/geos-replacement
      - name: Observe distinct replacement binding and actual geometry
        shell: pwsh
        run: |
          & out/geos-venv/Scripts/python.exe scripts/geos_windows_feasibility.py --replacement (Resolve-Path out/geos-replacement).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the unchanged-spec frozen worker and lean controller
        shell: pwsh
        run: |
          $worker = "out/geos-venv/Scripts/python.exe"
          & $worker -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $worker scripts/prepare_worker_assets.py --output out/geos-worker-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MARKITDOWN_WORKER_ASSETS = (Resolve-Path out/geos-worker-assets).Path
          & $worker -m PyInstaller --noconfirm --clean --distpath out/geos-dist --workpath out/geos-work packaging/ocr-worker.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $worker scripts/package_cpu_worker.py --bundle out/geos-dist/MarkItDownOCRWorker --output out/geos-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv out/geos-controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/geos-controller/Scripts/python.exe -m pip install --require-hashes -r packaging/profiles/cpu-windows-controller.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/geos-controller/Scripts/python.exe -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check frozen worker, managed integrity and replacement removal
        shell: pwsh
        run: |
          & out/geos-controller/Scripts/python.exe scripts/check_cpu_worker_acceptance.py --package-directory out/geos-package --report out/geos-reports/worker.json --geos-replacements out/geos-replacement 2>&1 | Tee-Object out/geos-integration.txt
          if ($LASTEXITCODE -ne 0) {
            $failure = ((Get-Content -Tail 8 out/geos-integration.txt) -join " | ").Replace("%","%25")
            Write-Output ("::error title=B3-3 worker integration::" + $failure)
            exit 1
          }
          $report = Get-Content -Raw out/geos-reports/worker.json | ConvertFrom-Json
          $value = $report.geos_replacement | ConvertTo-Json -Compress -Depth 8
          Write-Output ("::notice title=B3-3 worker integration::" + $value)
