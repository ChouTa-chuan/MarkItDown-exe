[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markitdown-desktop"
version = "0.8.1"
description = "Windows document conversion desktop application core"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8", "cryptography>=50.0.2,<51"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0"]
precise = ["pdfplumber==0.11.9", "pypdfium2==5.14.0"]
onnx = ["rapidocr-onnxruntime==1.4.4"]
test-formats = ["python-docx==1.2.0", "reportlab==4.4.9"]

[project.scripts]
markitdown-desktop = "desktop_app.cli:main"
markitdown-gui = "desktop_app.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_app = ["data/*.json", "data/*.md", "data/*.png", "data/licenses/**/*"]
